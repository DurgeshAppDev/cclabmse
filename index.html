
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body { margin: 0; font-family: Arial; background: #f4f4f4; }
        header, footer { background: navy; color: white; padding: 15px; text-align: center; }
        nav a { color: white; margin: 10px; text-decoration: none; }
        section { padding: 25px; text-align: center; }
        .hero { background: lightblue; padding: 50px 20px; }
        .cards { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; width: 180px; border-radius: 8px; }
        button { background: navy; color: white; padding: 10px 20px; border: 0; cursor: pointer; }
        input, textarea { padding: 10px; margin: 5px; width: 80%; max-width: 350px; }
    </style>
</head>
<body>

<header>
    <h1>My Website</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero" id="home">
    <h2>Welcome to My Website</h2>
    <p>Learn HTML and create your own website.</p>
    <button onclick="alert('Welcome!')">Get Started</button>
</section>

<section id="about">
    <h2>About Us</h2>
    <p>We create simple websites using HTML and CSS.</p>
</section>

<section id="services">
    <h2>Our Services</h2>
    <div class="cards">
        <div class="card"><h3>Web Design</h3><p>Beautiful websites.</p></div>
        <div class="card"><h3>Development</h3><p>Simple web apps.</p></div>
        <div class="card"><h3>Hosting</h3><p>GitHub Pages.</p></div>
    </div>
</section>

<section id="contact">
    <h2>Contact Us</h2>
    <form onsubmit="event.preventDefault(); alert('Message submitted!');">
        <input type="text" placeholder="Your Name" required><br>
        <input type="email" placeholder="Your Email" required><br>
        <textarea placeholder="Your Message" required></textarea><br>
        <button type="submit">Submit</button>
    </form>
</section>

<footer>
    <p>© 2026 My Website</p>
</footer>

</body>
</html>
